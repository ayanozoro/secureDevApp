<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101827" />
      <stop offset="100%" stop-color="#070910" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CD7F6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="shieldStroke" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CD7F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Dark obsidian rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-width="2.5" />

  <!-- Security shield -->
  <path
    d="M32 11L15 18.2V31.5C15 42.8 22.3 51.6 32 54.5C41.7 51.6 49 42.8 49 31.5V18.2L32 11Z"
    fill="url(#shieldFill)"
    stroke="url(#shieldStroke)"
    stroke-width="3.6"
    stroke-linejoin="round"
  />

  <!-- Verification checkmark -->
  <path
    d="M24 32.5L29.5 38L40.5 26"
    stroke="#E0F9FF"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
